# Spec: specs/009-pipeline-state-machine/spec.md
#
# The pure domain crate. Spec 009 owns the manifest floor and the `machine`
# module; `delta` (008), `pacing` (013), `settings` (014), `redaction` (015)
# and `ipc` (011) are added later by their own specs, each with an `extends`
# edge into this crate.
#
# Dependency policy (spec 009 §2, AC-3): no platform crate, no `tokio`, no
# `tauri`, no clock, no filesystem, no network. At phase 1 the crate has no
# runtime dependencies at all; `proptest` is the only dev dependency, required
# by FR-001 and FR-002. Spec 008 adds `strsim`, the crate's first runtime
# dependency: a pure-Rust edit distance with no transitive dependencies, which
# leaves AC-3's "no platform crate, no tokio, no tauri" intact. Every version is
# pinned once in the workspace manifest (spec 001 FR-004) and referenced here as
# `{ workspace = true }`.

[package]
name = "butler-core"
version = "0.1.0"
description = "Pure domain logic for butler-ai: the pipeline state machine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.butler]
spec = "009-pipeline-state-machine"

[dependencies]
# spec 008 §2: the only dependency the change detector needs.
strsim = { workspace = true }
# spec 011: the IPC contract's wire format and its TypeScript description.
# `serde` is in spec 009 §2's budget already ("for the IPC DTOs"); `specta`
# arrives with spec 011's additive `extends` edge onto this manifest, which
# names it. Both are pure Rust with no platform crate underneath, so spec 009
# AC-3's tree stays clean. See spec 011 D-1.
serde = { workspace = true }
specta = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
# spec 011 FR-001: the wire format the round-trip test round-trips through.
serde_json = { workspace = true }

# spec 008 AC-2: not gated in CI; run with `cargo bench -p butler-core`.
[[bench]]
name = "delta"
harness = false

[lints]
workspace = true
