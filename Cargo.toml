# Spec: specs/001-workspace-layout/spec.md
#
# The one Cargo workspace (spec 001 §3.1): virtual (no root package), resolver
# 3, members `crates/*` plus, once it exists, the Tauri app crate. A crate
# boundary is an ownership boundary: every member is owned by exactly one spec
# and names it in `[package.metadata.butler]`. Third-party crates are pinned
# here once and referenced by members as `{ workspace = true }`; Cargo.lock is
# committed and every cargo invocation runs `--locked`.
#
# The members list fills in with the phases (spec 001 §3.1, D-1): cargo treats
# a glob that matches nothing as a literal path and refuses any member without
# a manifest, so an entry lands in the same change as the crate it names.
# `crates/*` covers `butler-core` (spec 009), `butler-capture` (006),
# `butler-ocr` (007) and `butler-llm` (010); spec 004 appends
# `apps/desktop/src-tauri` when it lands the app crate (co-authority over this
# `[workspace]` table). Until the first crate exists the language gates are
# no-ops (spec 001 §3.5, spec 003 §3.2).

[workspace]
resolver = "3"
members = ["crates/*"]

# Inherited by every member with `<field>.workspace = true`.
[workspace.package]
edition = "2024"
rust-version = "1.92.0"
license = "AGPL-3.0-only"
repository = "https://github.com/bartekus/butler-ai"

# Every third-party crate is declared here exactly once (spec 001 FR-004) and
# referenced by members as `name = { workspace = true }`. Versions are caret
# requirements here and exact pins in Cargo.lock. The table fills as the
# crate-owning specs land their dependencies.
[workspace.dependencies]
# spec 009: the property tests behind FR-001 (purity) and FR-002 (totality).
# `fork` and `timeout` are off so the dev tree stays free of the process and
# temp-file machinery those features pull in; spec 009 AC-3 wants nothing
# platform-shaped anywhere near `butler-core`.
proptest = { version = "1.9", default-features = false, features = ["std", "bit-set"] }
# spec 008: the edit distance behind the change detector's similarity ratio.
# `default-features = false` drops the `ndarray`-backed extras; the crate then
# carries no dependencies at all, which keeps spec 009 AC-3's tree clean.
strsim = { version = "0.11", default-features = false }
# spec 008 AC-2: the change detector's benchmark. A dev dependency of the
# benchmark target only, never of the library, so spec 009 AC-3's constraint on
# `butler-core`'s own tree is untouched.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
# `deny`, not `forbid`: the platform crates (butler-capture, butler-ocr,
# butler-desktop) carry FFI under `#[allow(unsafe_code)]` with a `// SAFETY:`
# comment on the smallest possible block, so every exception is grep-able
# (spec 001 FR-005). Never in butler-core or butler-llm.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
