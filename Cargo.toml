# Spec: specs/001-workspace-layout/spec.md
#
# The one Cargo workspace (spec 001 §3.1): virtual (no root package), resolver
# 3, members `crates/*` plus, once it exists, the Tauri app crate. A crate
# boundary is an ownership boundary: every member is owned by exactly one spec
# and names it in `[package.metadata.butler]`. Third-party crates are pinned
# here once and referenced by members as `{ workspace = true }`; Cargo.lock is
# committed and every cargo invocation runs `--locked`.
#
# The members list fills in with the phases (spec 001 §3.1, D-1): cargo treats
# a glob that matches nothing as a literal path and refuses any member without
# a manifest, so an entry lands in the same change as the crate it names.
# `crates/*` covers `butler-core` (spec 009), `butler-capture` (006),
# `butler-ocr` (007) and `butler-llm` (010); spec 004 appends
# `apps/desktop/src-tauri` when it lands the app crate (co-authority over this
# `[workspace]` table). Until the first crate exists the language gates are
# no-ops (spec 001 §3.5, spec 003 §3.2).

[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

# Inherited by every member with `<field>.workspace = true`.
[workspace.package]
edition = "2024"
rust-version = "1.92.0"
license = "AGPL-3.0-only"
repository = "https://github.com/bartekus/butler-ai"

# Every third-party crate is declared here exactly once (spec 001 FR-004) and
# referenced by members as `name = { workspace = true }`. Versions are caret
# requirements here and exact pins in Cargo.lock. The table fills as the
# crate-owning specs land their dependencies.
[workspace.dependencies]
# spec 009: the property tests behind FR-001 (purity) and FR-002 (totality).
# `fork` and `timeout` are off so the dev tree stays free of the process and
# temp-file machinery those features pull in; spec 009 AC-3 wants nothing
# platform-shaped anywhere near `butler-core`.
proptest = { version = "1.9", default-features = false, features = ["std", "bit-set"] }
# spec 008: the edit distance behind the change detector's similarity ratio.
# `default-features = false` drops the `ndarray`-backed extras; the crate then
# carries no dependencies at all, which keeps spec 009 AC-3's tree clean.
strsim = { version = "0.11", default-features = false }
# spec 008 AC-2: the change detector's benchmark. A dev dependency of the
# benchmark target only, never of the library, so spec 009 AC-3's constraint on
# `butler-core`'s own tree is untouched.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# spec 004: the desktop shell. These reach `butler-desktop` only; spec 009 AC-3
# keeps them out of `butler-core`, and its test enforces the budget there.
# `macos-private-api` is what Tauri requires for a transparent window on
# macOS, which spec 004 section 3.2 mandates. It rules out Mac App Store
# distribution; spec 017 ships direct, notarized downloads, so nothing is lost.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-build = { version = "2" }
tauri-plugin-global-shortcut = { version = "2" }
thiserror = { version = "2" }
# macOS window level and collection behaviour (spec 004 section 3.2). The only
# FFI this crate does; spec 005 owns the exclusion FFI separately.
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }

# spec 011: the IPC contract. `serde` carries the wire format for the DTOs in
# `butler_core::ipc` (spec 009 section 2 already budgets it there); `specta`
# describes those same types to the TypeScript exporter, and `tauri-specta`
# turns them into the committed `bindings.ts` and registers the commands.
#
# specta 2 and tauri-specta 2 are published only as release candidates. That is
# what the Tauri v2 ecosystem ships: the v1 lines resolve against Tauri v1 and
# cannot be used here.
#
# The three are pinned exactly, and they have to move together: tauri-specta
# requires `specta` with `=`, and specta-typescript does too, so any bump is a
# simultaneous bump of all three. This trio is the newest that compiles on the
# toolchain spec 001 pins (1.92.0): specta rc.24 and rc.25 use
# `fmt::from_fn`, still unstable there, and fail with E0658. Raising the
# toolchain is spec 001's decision, not this spec's.
# Review trigger: move to the stable 2.0 line, or to rc.25 with a toolchain
# bump, whichever comes first. See spec 011 D-2.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
# spec 011 FR-001: the round-trip needs a concrete format. Dev-only in
# butler-core, where it is the test's format and never the library's.
serde_json = { version = "1" }
specta = { version = "=2.0.0-rc.22", default-features = false, features = ["derive"] }
specta-typescript = { version = "=0.0.9" }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

# spec 014: the settings store. `toml` is the on-disk format (§3.2) and
# `dirs` finds the platform config directory. Both reach `butler-desktop`
# only: spec 009 §2 keeps the file format and the filesystem out of
# `butler-core`, which is why FR-003's golden lives with the store.
toml = { version = "1" }
dirs = { version = "6" }

# spec 016: structured, content-free tracing and the diagnostics bundle.
# `json` for the line format §3.1 fixes, `env-filter` deliberately NOT
# enabled: the level comes from settings, and an environment filter would be
# exactly the environment-variable surface spec 014 FR-005 forbids.
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std", "registry"] }
tracing-appender = { version = "0.2" }
zip = { version = "8", default-features = false, features = ["deflate"] }

# spec 019: the effect executor. Reaches `butler-desktop` only; spec 009 AC-3
# bans it from `butler-core` and that crate's own test enforces the budget.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", default-features = false }

# spec 006: the capture crate. `xcap` goes through the compositor path on
# both platforms (DXGI desktop duplication on Windows, ScreenCaptureKit on
# macOS), which is the property spec 005's self-test relies on: a window-list
# composition could re-include a window the OS was asked to exclude.
# `zeroize` is what makes a dropped `Frame` stop existing in freed memory.
xcap = { version = "0.9" }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# spec 007: the OCR crate. The engines are the operating systems' own, so no
# model ships with the app and no pixels leave the process; these are only the
# bindings. `unicode-normalization` and `unicode-segmentation` back the pure
# normalization pass (§3.4), which runs on every target including Linux.
unicode-normalization = { version = "0.1" }
unicode-segmentation = { version = "1" }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNObservation", "VNRecognizeTextRequest", "VNRequestHandler", "VNTypes", "VNDefines", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGColorSpace", "CGDataProvider", "CGContext"] }
# spec 007 needs the OCR and imaging modules; spec 005 needs the Win32 window
# ones for SetWindowDisplayAffinity and its read-back.
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Globalization", "Foundation", "Foundation_Collections", "Storage_Streams", "Security_Cryptography", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# `RecognizeAsync` returns a `windows_future::IAsyncOperation`, and the
# `windows` crate does not re-export that type, so the crate that waits on one
# names it directly (spec 007 D-5).
windows-future = { version = "0.3" }

[workspace.lints.rust]
# `deny`, not `forbid`: the platform crates (butler-capture, butler-ocr,
# butler-desktop) carry FFI under `#[allow(unsafe_code)]` with a `// SAFETY:`
# comment on the smallest possible block, so every exception is grep-able
# (spec 001 FR-005). Never in butler-core or butler-llm.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
