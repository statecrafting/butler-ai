# Spec: specs/003-governance-ci/spec.md
#
# The single CI entry point. Every check butler-ai runs is a job here, and
# `jobs.ci-gate` aggregates them into the ONE status check branch protection
# requires (spec 003 §3.1). The governance chain lives in `spec-spine.yml` and
# is pulled in as a reusable workflow, so it reports through this gate rather
# than publishing a second, identically-named check.
#
# Every Rust step is guarded by a populated workspace (Cargo.toml plus at least
# one crates/*/Cargo.toml, spec 001 §3.5) and every web step by
# pnpm-workspace.yaml, so those jobs are green until there is something to build
# and real thereafter. `on`, `permissions`, `jobs.rust`, `jobs.web`,
# `jobs.govern` and `jobs.ci-gate` are section units owned by spec 003.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Detect workspace
        id: ws
        shell: bash
        # Cargo refuses to load a workspace whose member entries match nothing
        # (spec 001 §3.1), so the root manifest alone does not activate the gates.
        run: echo "present=$([ -f Cargo.toml ] && ls crates/*/Cargo.toml >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        if: steps.ws.outputs.present == 'true'
        run: rustc --version && cargo --version
      - name: Cache cargo
        if: steps.ws.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        if: steps.ws.outputs.present == 'true'
        run: cargo build --workspace --locked
      - name: Test
        if: steps.ws.outputs.present == 'true'
        run: cargo test --workspace --locked
      - name: Clippy
        if: steps.ws.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Format
        if: steps.ws.outputs.present == 'true'
        run: cargo fmt --all --check
      # cargo-deny runs as a command, not as EmbarkStudios/cargo-deny-action,
      # which is a Docker container action and so is Linux-only; this matrix is
      # Windows and macOS (spec 003 D-1).
      - name: Install cargo-deny
        if: steps.ws.outputs.present == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny
        if: steps.ws.outputs.present == 'true'
        run: cargo deny check
      # Spec 011: the committed TypeScript bindings must be what the Rust
      # contract generates.
      - name: IPC bindings are fresh
        if: steps.ws.outputs.present == 'true' && hashFiles('apps/desktop/src-tauri/src/bin/export-bindings.rs') != ''
        shell: bash
        run: |
          cargo run -p butler-desktop --bin export-bindings --locked
          git diff --exit-code -- apps/desktop/src/generated
      - name: No populated workspace yet
        if: steps.ws.outputs.present == 'false'
        run: echo "No Cargo workspace member yet; the Rust gates activate when spec 009 lands the first crate (phase 1)."

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect workspace
        id: ws
        run: echo "present=$([ -f pnpm-workspace.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.ws.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.ws.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.ws.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: steps.ws.outputs.present == 'true'
        run: pnpm -r typecheck
      - name: Lint
        if: steps.ws.outputs.present == 'true'
        run: pnpm -r lint
      - name: Test
        if: steps.ws.outputs.present == 'true'
        run: pnpm -r test
      - name: Build
        if: steps.ws.outputs.present == 'true'
        run: pnpm -r build
      - name: No workspace yet
        if: steps.ws.outputs.present == 'false'
        run: echo "pnpm-workspace.yaml absent; the web gates activate when spec 001 lands (phase 1)."

  # The governance chain, as a reusable workflow so its result reaches ci-gate.
  govern:
    uses: ./.github/workflows/spec-spine.yml

  # Spec 003 §3.1: the single required status check for branch protection and
  # the merge queue. It aggregates every CI job, so branch protection requires
  # just this one name instead of an enumerated, drift-prone list. A skipped job
  # counts as a pass; a failed or cancelled job fails the gate.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [rust, web, govern]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to have passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "  rust=${{ needs.rust.result }} web=${{ needs.web.result }} govern=${{ needs.govern.result }}"
          exit 1
      - name: All required CI jobs passed
        run: |
          echo "ci-gate passed: rust, web and govern are all green or skipped"
