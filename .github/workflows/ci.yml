# Spec: specs/003-governance-ci/spec.md
#
# The single CI entry point. Every check butler-ai runs is a job here, and
# `jobs.ci-gate` aggregates them into the ONE status check branch protection
# requires (spec 003 §3.1). The governance chain lives in `spec-spine.yml` and
# is pulled in as a reusable workflow, so it reports through this gate rather
# than publishing a second, identically-named check.
#
# Every Rust step is guarded by a populated workspace (Cargo.toml plus at least
# one crates/*/Cargo.toml, spec 001 §3.5) and every web step by
# pnpm-workspace.yaml, so those jobs are green until there is something to build
# and real thereafter. `on`, `permissions`, `jobs.rust`, `jobs.web`,
# `jobs.govern` and `jobs.ci-gate` are section units owned by spec 003.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Spec 003 §3.4: static checks that catch a CI defect on the day it is
  # written rather than on the day a guard opens. D-1 (a Docker container
  # action on a Windows/macOS matrix) sat unexercised from phase 0 to phase 1
  # and `actionlint` does not catch it, so this check is ours.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No container action on a non-Linux runner
        run: ./scripts/check-action-runners.sh

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Detect workspace
        id: ws
        shell: bash
        # Cargo refuses to load a workspace whose member entries match nothing
        # (spec 001 §3.1), so the root manifest alone does not activate the gates.
        run: echo "present=$([ -f Cargo.toml ] && ls crates/*/Cargo.toml >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Spec 003 D-3: from phase 1 onward a crate always exists, so a closed
      # guard here is a regression, not a no-op. Fail loudly instead of
      # skipping every gate below and reporting green.
      - name: Require a populated workspace
        shell: bash
        run: |
          if [ "${{ steps.ws.outputs.present }}" != "true" ]; then
            echo "::error::the Rust gates must be active from phase 1 onward, but no crates/*/Cargo.toml was found"
            exit 1
          fi
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Format
        run: cargo fmt --all --check
      # cargo-deny runs as a command, not as EmbarkStudios/cargo-deny-action,
      # which is a Docker container action and so is Linux-only; this matrix is
      # Windows and macOS (spec 003 D-1).
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny
        run: cargo deny check
      # Spec 011: the committed TypeScript bindings must be what the Rust
      # contract generates.
      # Legitimately conditional until spec 011 lands the generator. Spec 003
      # §3.4: an inactive gate MUST say so, so a skip is never mistaken for a
      # pass and a mistyped guard path cannot hide forever.
      - name: IPC bindings are fresh
        if: hashFiles('apps/desktop/src-tauri/src/bin/export-bindings.rs') != ''
        shell: bash
        run: |
          cargo run -p butler-desktop --bin export-bindings --locked
          git diff --exit-code -- apps/desktop/src/generated
      - name: IPC bindings gate is INACTIVE
        if: hashFiles('apps/desktop/src-tauri/src/bin/export-bindings.rs') == ''
        run: |
          echo "::notice::IPC bindings gate inactive: export-bindings.rs absent (spec 011, phase 2)"

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect workspace
        id: ws
        shell: bash
        run: |
          # spec 001 landed pnpm-workspace.yaml in phase 1, so this is a
          # regression check, not a no-op guard (spec 003 D-3).
          if [ ! -f pnpm-workspace.yaml ]; then
            echo "::error::pnpm-workspace.yaml is required from phase 1 onward"
            exit 1
          fi
          # A package that pnpm does not discover would make every gate below
          # pass vacuously. Report how many it sees so the state is explicit.
          echo "packages=$(find apps -mindepth 2 -maxdepth 2 -name package.json 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Spec 003 §3.4: the web gates run `pnpm -r`, which exits 0 when it
      # matches no project. Until a package exists that is correct; once one
      # does, a zero match means the workspace globs missed it and every gate
      # below is vacuous. Refuse that rather than report green.
      - name: Workspace packages are discovered
        shell: bash
        run: |
          declared="${{ steps.ws.outputs.packages }}"
          found="$(pnpm -r list --depth -1 --json 2>/dev/null | grep -c '"name"' || true)"
          echo "apps/*/package.json on disk: $declared; pnpm discovers: $found"
          if [ "$declared" -gt 0 ] && [ "$found" -eq 0 ]; then
            echo "::error::$declared package(s) on disk but pnpm discovers none; check pnpm-workspace.yaml globs"
            exit 1
          fi
          if [ "$declared" -eq 0 ]; then
            echo "::notice::web gates are vacuous: no apps/*/package.json yet (spec 012, phase 2)"
          fi
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Test
        run: pnpm -r test
      - name: Build
        run: pnpm -r build

  govern:
    uses: ./.github/workflows/spec-spine.yml

  # Spec 003 §3.1: the single required status check for branch protection and
  # the merge queue. It aggregates every CI job, so branch protection requires
  # just this one name instead of an enumerated, drift-prone list. A skipped job
  # counts as a pass; a failed or cancelled job fails the gate.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [preflight, rust, web, govern]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to have passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "  preflight=${{ needs.preflight.result }} rust=${{ needs.rust.result }} web=${{ needs.web.result }} govern=${{ needs.govern.result }}"
          exit 1
      - name: All required CI jobs passed
        run: |
          echo "ci-gate passed: preflight, rust, web and govern are all green or skipped"
