# Spec: specs/003-governance-ci/spec.md
#
# The governance gate: spec-spine's gate chain on every PR. Nothing here writes
# to .derived/ (a writing `compile` before `--check` would make the freshness
# check pass unconditionally). The `on`, `permissions`, `jobs.govern` and
# `jobs.gate` blocks are section units owned by spec 003: editing them without
# editing that spec fails the coupling gate.
name: spec-spine

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  govern:
    name: govern (compile --check · index check · lint · coverage · couple)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the coupling gate can diff against the merge base.
          fetch-depth: 0
      - name: Install spec-spine (pinned in Makefile)
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^SPEC_SPINE_VERSION ?= //p' Makefile)"
          echo "installing spec-spine v${ver}"
          curl -fsSL https://raw.githubusercontent.com/statecrafting/spec-spine/main/install.sh \
            | SPEC_SPINE_VERSION="v${ver}" SPEC_SPINE_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spec-spine" --version
      - name: Compile registry (validation + shard freshness)
        run: spec-spine compile --check
      - name: Codebase index freshness
        run: spec-spine index check
      - name: Conformance lint (fail on warn)
        run: spec-spine lint --fail-on-warn
      # The ownership ratchet (spec 000 §7.5): every source file inside a
      # discovered package must be specifically claimed by a spec.
      - name: Ownership coverage (fail on untraced)
        run: spec-spine index coverage --fail-on-untraced
      - name: Burn-down (informational)
        run: spec-spine index render | grep -c 'W-001' | sed 's/^/unresolved owning units: /' || true
      # PR-only: the gate reads the PR-body waiver, which push/merge_group do
      # not carry. Diff the event's frozen SHAs, never the merge ref.
      - name: Coupling gate (spec/code drift + ownership)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "coupling base: $BASE_SHA → head: $HEAD_SHA"
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.txt"
          spec-spine couple --base "$BASE_SHA" --head "$HEAD_SHA" --pr-body "$RUNNER_TEMP/pr-body.txt"

  # The single required status check for branch protection.
  gate:
    name: gate
    if: ${{ always() }}
    needs: [govern]
    runs-on: ubuntu-latest
    steps:
      - name: Require all governance jobs to have passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "govern=${{ needs.govern.result }}"
          exit 1
      - run: echo "gate passed"
