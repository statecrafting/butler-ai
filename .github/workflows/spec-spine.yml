# Spec: specs/003-governance-ci/spec.md
#
# The governance gate: spec-spine's gate chain on every PR. Nothing here writes
# to .derived/ (a writing `compile` or `index` before the freshness read would
# make that read pass unconditionally).
#
# Freshness is one verb since spec-spine 0.18.0 (spec-spine spec 075): `check`
# asks about both committed shard trees in one call, reports them separately,
# and returns the more severe of the two verdicts (3, then 1, then 2, then 0).
# It replaces the `compile --check` and `index check` pair that stood here.
#
# This is a REUSABLE workflow (spec 003 §3.1). It declares no event triggers of
# its own: `ci.yml` calls it as `jobs.govern`, so its result folds into the one
# `ci-gate` check branch protection requires, instead of publishing a second,
# separately-named status check. The `github` context inside a called workflow
# is the caller's, so `github.event.pull_request` below is the real PR event.
#
# The `on`, `permissions` and `jobs.govern` blocks are section units owned by
# spec 003: editing them without editing that spec fails the coupling gate.
name: spec-spine

on:
  workflow_call:

permissions:
  contents: read

jobs:
  govern:
    name: govern (check · lint · coverage · couple)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the coupling gate can diff against the merge base.
          fetch-depth: 0
      - name: Install spec-spine (pinned in Makefile)
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^SPEC_SPINE_VERSION ?= //p' Makefile)"
          echo "installing spec-spine v${ver}"
          curl -fsSL https://raw.githubusercontent.com/statecrafting/spec-spine/main/install.sh \
            | SPEC_SPINE_VERSION="v${ver}" SPEC_SPINE_BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spec-spine" --version
      # One verb, both committed trees, read-only (spec-spine spec 075).
      # `--fail-on-warn` covers the compile half's warning-tier violations.
      # `--fail-on-unresolved` is deliberately absent: butler-ai is specified
      # before it is built, so unresolved units on an approved-but-pending spec
      # are the counted W-001 burn-down, not a CI failure (spec 002 D-4).
      - name: Freshness (spec registry + codebase index)
        run: spec-spine check --fail-on-warn
      - name: Conformance lint (fail on warn)
        run: spec-spine lint --fail-on-warn
      # The ownership ratchet (spec 000 §7.5): every source file inside a
      # discovered package must be specifically claimed by a spec.
      - name: Ownership coverage (fail on untraced)
        run: spec-spine index coverage --fail-on-untraced
      - name: Burn-down (informational)
        run: |
          spec-spine index render | grep -c 'W-001' | sed 's/^/unresolved owning units: /' || true
      # PR-only: the gate reads the PR-body waiver, which push/merge_group do
      # not carry. Diff the event's frozen SHAs, never the merge ref.
      - name: Coupling gate (spec/code drift + ownership)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "coupling base: $BASE_SHA → head: $HEAD_SHA"
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body.txt"
          spec-spine couple --base "$BASE_SHA" --head "$HEAD_SHA" --pr-body "$RUNNER_TEMP/pr-body.txt"
