# spec-spine configuration for butler-ai.
#
# butler-ai is specified before it is built: every product spec declares the
# crates, files, modules and symbols it will own, and `spec-spine index` reports
# each not-yet-existing unit as a counted W-001 warning (spec-spine spec 025).
# That warning list IS the build burn-down (`make burndown`). As code lands,
# warnings resolve; when a spec flips to `implementation: complete`, an
# unresolved unit becomes a hard error. Nothing here is a default left implicit:
# every knob is written out so the governance model is legible in one file.

[meta]
# The binary this corpus is governed by (spec-spine spec 062). The CLI checks
# itself on every run and refuses with exit 3 when it does not satisfy the
# requirement, which is what makes the version question answerable BEFORE an
# exit code is interpreted: a binary predating a flag rejects it, and reading
# that rejection as staleness sends a session to regenerate shards that were
# already correct. Keep this in lockstep with `SPEC_SPINE_VERSION` in the
# Makefile, which is what CI and `make setup` install.
required_version = ">=0.17.0"

[manifest]
# Cargo: `[package.metadata.butler].spec = "NNN-slug"`
# npm:   `"butler": { "spec": "NNN-slug" }` in package.json
metadata_namespace = "butler"

[domains]
# Closed taxonomy: every spec declares exactly one (L-002 otherwise).
#   governance   the corpus, the harness, CI, release plumbing
#   platform     the desktop shell, OS hooks, configuration, diagnostics
#   pipeline     capture -> OCR -> change detection -> state machine
#   assistant    inference, prompting, provider routing, secrets
#   ui           the overlay DOM, rendering, pacing presentation
#   distribution packaging, signing, updates
allowed = ["governance", "platform", "pipeline", "assistant", "ui", "distribution"]

[kind]
# Closed taxonomy: every spec declares exactly one (L-003 otherwise).
#   constitutional-bootstrap  tier-1, exactly one (000)
#   feature                   a capability with owned code units
#   tooling                   developer/CI/harness surface
#   constraint                cross-cutting invariants asserted via `constrains`
#   plan                      a sequencing plan over other specs (no code units)
allowed = ["constitutional-bootstrap", "feature", "tooling", "constraint", "plan"]

[layout]
specs_dir     = "specs"
derived_dir   = ".derived"
standards_dir = "standards/spec"
schemas_dir   = "standards/schemas"
# Spec 001: one root Cargo workspace (crates/* + apps/desktop/src-tauri) and one
# pnpm workspace (apps/*). Both are discovered from the root manifests; nothing
# lives outside them, so the standalone lists stay empty.
cargo_workspace = "Cargo.toml"
npm_workspaces = ["package.json", "pnpm-workspace.yaml"]
standalone_rust_workspaces = []
standalone_npm_packages    = []

[index]
# Everything the harness and the gates depend on is folded into the staleness
# hash, so an edit to any of it without `spec-spine index` fails `index check`.
# `.claude/agent-memory/` is deliberately NOT matched (gitignored local state).
#
# EVERY PATTERN ENDS IN A FILE COMPONENT, AND THAT IS THE POINT. In the glob
# crate `dir/**` matches a sequence of path COMPONENTS, so it enumerates
# directories, and the hasher keeps only entries that are files: `dir/**`
# therefore matches nothing at all, silently (spec-spine spec 069). Six entries
# here were in that form until 2026-09-08, which meant the constitution, the
# contract, the templates, every workflow and every `.claude/` agent, rule and
# skill had never contributed to any content hash while this comment said they
# had. Do not "simplify" a `**/*` back to `**`.
#
# The patterns are narrow on purpose (spec-spine spec 057 §4). A bare
# `.claude/**/*` would fold in `.DS_Store`, `agent-memory/` and
# `settings.local.json`, making the shard hashes machine-dependent; and an entry
# here restamps the GLOBAL scalar, restaling every shard when it changes, so it
# earns its place by being a governance file some spec claims.
extra_hashed_inputs = [
  "standards/**/*.md",
  ".github/workflows/*.yml",
  ".github/dependabot.yml",
  ".claude/settings.json",
  ".claude/agents/*.md",
  ".claude/rules/*.md",
  ".claude/skills/*/*.md",
  ".mcp.json",
  "AGENTS.md",
  "CLAUDE.md",
  "Makefile",
  "CODEOWNERS",
  ".gitattributes",
  ".githooks/*.sh",
  "scripts/*.sh",
  "scripts/*.py",
  # Spec 001's toolchain and dependency-policy surface: each is claimed by a
  # spec, and each changes what the build and the supply-chain gate accept.
  "rust-toolchain.toml",
  "deny.toml",
  "package.json",
  "pnpm-workspace.yaml",
  ".nvmrc",
  "apps/desktop/src-tauri/tauri.conf.json",
  "apps/desktop/src-tauri/capabilities/*.json",
]
resolver_exclusions = ["target", "node_modules", ".derived", "dist", "build", ".next", ".vite", "gen"]

# Named hash slices (spec-spine spec 012): `spec-spine index check --slice <name>`
# fails independently of the global hash, so a PR that touches only the harness
# can be gated on the harness slice alone.
[index.slices]
governance = [
  "standards/**/*.md",
  ".claude/settings.json",
  ".claude/agents/*.md",
  ".claude/rules/*.md",
  ".claude/skills/*/*.md",
  ".mcp.json",
  "AGENTS.md",
  "CLAUDE.md",
  ".github/workflows/*.yml",
]
# The Tauri security surface: window config, CSP, and the capability grants.
# Spec 004 owns the file; spec 015 constrains it. A change here is a security
# review by construction.
desktop-security = [
  "apps/desktop/src-tauri/tauri.conf.json",
  "apps/desktop/src-tauri/capabilities/*.json",
]

[lint]
# Claimed source files this corpus has decided to leave out of every content
# hash (spec-spine spec 057 §3.5). A `file` unit carries no span, and only
# span-backing sources are folded into a shard hash, so a bare `file` claim on
# a source file is witnessed by nothing: `index check` will not call the index
# stale for an edit to one.
#
# These forty-nine are not undefended, and that is why the gap is acceptable
# here rather than merely tolerated: `require_ownership` is on, so `couple`
# refuses a changed source file whose owning spec did not change in the same
# PR. That is the check protecting this surface, and it is stricter than
# staleness. What the gap costs is narrow and is written down here: the index
# does not notice the edit, and a corpus attestation covers a ledger that never
# read those bytes.
#
# Suppressing the warning does NOT suppress the count: `index check` keeps
# reporting the total, which is the difference between recording a decision and
# turning a check off. The governance surface is hashed instead, above.
unwitnessed_allowed = [
  # Per-app prose, claimed by 005, 006 and 007 so each documents its own
  # surface in one place. This entry mirrors the `**/README.md` line in
  # `[coupling] bypass_prefixes` deliberately: the two are the same decision,
  # that README prose is documentation and not authority. Hashing it would
  # restamp the global scalar and force a full reindex on every prose edit,
  # which is the governance drag the bypass exists to avoid.
  "**/README.md",
  "crates/**/*.rs",
  "apps/desktop/src-tauri/src/**/*.rs",
  "apps/desktop/src-tauri/build.rs",
  "apps/desktop/src/**/*.ts",
  "apps/desktop/src/**/*.tsx",
  "apps/desktop/src/**/*.css",
  "apps/desktop/index.html",
  "apps/desktop/vite.config.ts",
  "apps/desktop/eslint.config.js",
  "apps/desktop/tsconfig.json",
]

[branding]
compiler_id = "butler-ai"
indexer_id  = "butler-ai"

[coupling]
# Additions to the built-in bypass floor (docs/, README.md, LICENSE, lockfiles,
# .derived/, .github/ ...). Additive only.
#   **/README.md   per-crate / per-app prose
#   plans/         /implement-plan working files (never authority)
#   .editorconfig  editor hygiene
bypass_prefixes = ["**/README.md", "plans/", ".editorconfig", ".nvmrc"]
waiver_keyword = "Spec-Drift-Waiver:"
# The ownership ratchet (spec-spine spec 032), ON from day one: butler-ai is
# greenfield, so there is no debt to burn down and no reason to ever admit a
# source file that no spec specifically claims. A changed source file covered
# only by its crate's manifest floor, or by nothing, is a C-002 refusal. CI also
# runs `index coverage --fail-on-untraced` (spec 003). Bootstrap anchor:
# `ownership-ratchet` (specs/000-butler-bootstrap).
require_ownership = true
# Dependabot-class PRs (version-pin-only manifest edits) self-waive; anything
# more fails closed (spec-spine spec 005 §3.5 / spec 030).
auto_waive_dependency_only = true

[provenance.uri_schemes]
knowledge        = "knowledge://"
code-fingerprint = "fingerprint://"
# Architecture decisions recorded in docs/ are cited from specs by this scheme.
adr              = "adr://"

[frontmatter]
# butler-specific keys, promoted to first-class so they carry any YAML value
# (spec-spine spec 013) and are validated by the corpus lint documented in
# standards/spec/contract.md §"Extra keys":
#   platforms  list of target OSes a spec applies to: "windows" | "macos" | "all"
#   phase      integer build phase from specs/018-implementation-sequencing
extra_known_keys = ["platforms", "phase"]
