# Spec: specs/004-desktop-shell/spec.md
[package]
name = "butler-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.butler]
spec = "004-desktop-shell"

[lib]
name = "butler_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# spec 011: the IPC types are defined once, in the pure core, and this crate
# is the only place they meet Tauri.
# The version is carried alongside the path because `cargo deny` reads a
# path dependency without one as a wildcard requirement, and spec 001 FR-004
# bans those (`[bans] wildcards = "deny"`). Neither crate is published, so the
# number is only ever read by that check.
butler-core = { path = "../../../crates/butler-core", version = "0.1.0" }
# spec 005: the self-test captures through the same compositor path recording
# tools use, which is the whole reason its answer means anything.
butler-capture = { path = "../../../crates/butler-capture", version = "0.1.0" }
tauri = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
serde = { workspace = true }
# spec 014 §3.4: the exporter serializes `Settings::default()` into the
# generated bindings so "Reset to defaults" has one source, in Rust.
serde_json = { workspace = true }
thiserror = { workspace = true }
# spec 014: the on-disk settings format and where it lives.
toml = { workspace = true }
dirs = { workspace = true }
# spec 016: tracing, its rolling file appender, and the bundle's archive.
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
zip = { workspace = true }

# Spec 004 section 3.2: the macOS window level and collection behaviour have no
# Tauri equivalent, so this crate does that one piece of FFI itself. Spec 001
# FR-005 allows it here (a platform crate) under `#[allow(unsafe_code)]` with a
# `// SAFETY:` note on the smallest possible block.
[target.'cfg(target_os = "windows")'.dependencies]
# spec 005 §3.2: SetWindowDisplayAffinity and its read-back.
windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }

[lints]
workspace = true
